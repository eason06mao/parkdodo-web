# 每次推送或開 PR 時自動檢查：型別、Lint、金流加解密測試、資料表約束測試、正式建置
name: 自動檢查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # Actions 頁面的「Run workflow」按鈕：手動重新檢查並部署

permissions:
  contents: read

jobs:
  web:
    name: 程式檢查與建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型別檢查
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: 統一金流加解密測試
        run: npm run test:payuni
      - name: 電子發票格式測試
        run: npm run test:invoice
      - name: 計費規則測試
        run: npm run test:billing
      - name: 自訂角色規則測試
        run: npm run test:roles
      - name: 月租建檔規則測試
        run: npm run test:monthly
      - name: 統編資料解析測試
        run: npm run test:taxreg
      - name: 會員規則測試
        run: npm run test:members
      - name: 品牌設定測試
        run: npm run test:branding
      - name: 車牌搜尋與認車照片測試
        run: npm run test:platesearch
      - name: 正式建置
        run: npm run build

  database:
    name: 資料表約束測試
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parkdodo
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: pdtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parkdodo -d pdtest"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: parkdodo
      PGPASSWORD: ci_only
      PGDATABASE: pdtest
    steps:
      - uses: actions/checkout@v4
      - name: 建立資料表
        run: |
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0001_v2_core.sql
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0002_tenancy_licensing.sql
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0003_custom_roles.sql
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0004_edge_link.sql
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0005_monthly_detail.sql
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0006_tax_registry.sql
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0007_members.sql
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0008_org_branding.sql
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0009_parking_payments.sql
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0010_late_payment.sql
          psql -v ON_ERROR_STOP=1 -q -f db/migrations/0011_front_images.sql
      - name: 約束測試
        run: |
          psql -v ON_ERROR_STOP=1 -f db/tests/0001_constraints_test.sql | tee t1.log
          psql -v ON_ERROR_STOP=1 -f db/tests/0002_tenancy_test.sql | tee t2.log
          psql -v ON_ERROR_STOP=1 -f db/tests/0003_custom_roles_test.sql | tee t3.log
          grep -q "ALL CONSTRAINT TESTS PASSED" t1.log
          grep -q "ALL TENANCY TESTS PASSED" t2.log
          grep -q "ALL CUSTOM ROLE TESTS PASSED" t3.log
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 工控機連線測試（配對、入出場、斷網補傳、遠端開閘）
        env:
          DATABASE_URL: postgres://parkdodo:ci_only@localhost:5432/pdedge
        run: |
          createdb pdedge
          node scripts/migrate.mjs --seed
          npm run test:edge
      - name: 停車繳費串接測試（報價、訂單、統一金流通知入帳、出口放行）
        env:
          DATABASE_URL: postgres://parkdodo:ci_only@localhost:5432/pdedge
        run: npm run test:payments

  # main 合併後、兩項檢查都通過才部署測試站。尚未設定 GCP 變數時自動略過。
  deploy-staging:
    name: 部署測試站
    needs: [web, database]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    concurrency: staging
    permissions:
      contents: read
      id-token: write   # 用 Workload Identity 登入 Google Cloud，不存放任何金鑰檔
    env:
      REGION: asia-east1
      IMAGE: asia-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/parkdodo/web:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # 雲端資料庫：執行過 scripts/gcp-cloudsql-setup.sh、並在 GitHub Variables 設 CLOUDSQL_INSTANCE 後才啟用
      - name: 更新雲端資料表（Cloud SQL）
        if: vars.CLOUDSQL_INSTANCE != ''
        run: |
          curl -sSLo cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${{ vars.CLOUDSQL_INSTANCE }}" &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && break; sleep 1; done
          npm ci --omit=dev --ignore-scripts
          DATABASE_URL="$(gcloud secrets versions access latest --secret staging-database-migrate-url)" node scripts/migrate.mjs --seed
      - name: 建置並上傳映像檔
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      # 統一金流：執行過 scripts/gcp-payuni-secrets.sh 後，GitHub Variables 設 PAYUNI_SECRETS=on（各站個別商店再設 PAYUNI_SITES="TXG002 ..."）
      - name: 部署到 Cloud Run（台灣）
        env:
          CLOUDSQL: ${{ vars.CLOUDSQL_INSTANCE }}
          BUCKET: ${{ vars.EDGE_IMAGE_BUCKET }}
          PAYUNI: ${{ vars.PAYUNI_SECRETS }}
          PAYUNI_SITES: ${{ vars.PAYUNI_SITES }}
          PAYUNI_ENV: ${{ vars.PAYUNI_ENV || 'sandbox' }}
          PAYUNI_METHODS: ${{ vars.PAYUNI_METHODS }}
        run: |
          SECRETS="STAGING_BASIC_AUTH=staging-basic-auth:latest"
          [ -n "$CLOUDSQL" ] && SECRETS="$SECRETS,DATABASE_URL=staging-database-url:latest"
          if [ "$PAYUNI" = "on" ]; then
            SECRETS="$SECRETS,PAYUNI_MER_ID=payuni-mer-id:latest,PAYUNI_HASH_KEY=payuni-hash-key:latest,PAYUNI_HASH_IV=payuni-hash-iv:latest"
          fi
          for c in $PAYUNI_SITES; do
            c=$(echo "$c" | tr -cd 'A-Za-z0-9' | tr a-z A-Z); l=$(echo "$c" | tr A-Z a-z)
            [ -n "$c" ] && SECRETS="$SECRETS,PAYUNI_MER_ID_$c=payuni-mer-id-$l:latest,PAYUNI_HASH_KEY_$c=payuni-hash-key-$l:latest,PAYUNI_HASH_IV_$c=payuni-hash-iv-$l:latest"
          done
          # 環境變數以 @ 分隔（gcloud 的 ^@^ 語法），因為 PAYUNI_METHODS 的值本身含逗號
          ENVS="PAYUNI_ENV=$PAYUNI_ENV"
          [ -n "$BUCKET" ] && ENVS="$ENVS@EDGE_IMAGE_BUCKET=$BUCKET"
          [ -n "$PAYUNI_METHODS" ] && ENVS="$ENVS@PAYUNI_METHODS=$(echo "$PAYUNI_METHODS" | tr -d ' ')"
          ENVS="^@^$ENVS"
          SQL_FLAG=""
          [ -n "$CLOUDSQL" ] && SQL_FLAG="--add-cloudsql-instances=$(echo "$CLOUDSQL" | tr -d '[:space:]')"
          gcloud run deploy parkdodo-staging \
            --image "$IMAGE" --region "$REGION" \
            --service-account "parkdodo-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 2 --memory 512Mi --cpu 1 \
            --set-secrets "$SECRETS" $SQL_FLAG \
            --set-env-vars "$ENVS" \
            --quiet
          echo "測試站網址：$(gcloud run services describe parkdodo-staging --region "$REGION" --format='value(status.url)')" >> "$GITHUB_STEP_SUMMARY"
